<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <form class="weatherForm">
        <input type="text" placeholder="Enter City Name" class="cityInput">
        <button type="submit">Get Weather</button>
    </form>
    <div class="card" style="display: none">
        <h1 class="cityDisplay">Los Angels</h1>
        <!-- Alt + 0176 = ° -->
        <p class="tempDisplay">90°</p>
        <p class="humidityDisplay">Humidity: 60%</p>
        <p class="descDisplay">Clear Sky</p>
        <p class="weatherEmoji">🌇</p>
        <p class="errorMsg">Please Enter Valid City</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
